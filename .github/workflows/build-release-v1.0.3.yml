name: Build and attach v1.0.3 firmware

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-release-v1.0.3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v1.0.3
        uses: actions/checkout@v4
        with:
          ref: v1.0.3
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build Cardputer firmware
        run: pio run -e m5stack-stamps3

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cp .pio/build/m5stack-stamps3/firmware.bin              IU2VTP_Cardputer_DMR_Terminal_v1.0.3_Cardputer.bin
          sha256sum IU2VTP_Cardputer_DMR_Terminal_v1.0.3_Cardputer.bin             > IU2VTP_Cardputer_DMR_Terminal_v1.0.3_Cardputer.bin.sha256

      - name: Upload assets to release v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.3             IU2VTP_Cardputer_DMR_Terminal_v1.0.3_Cardputer.bin             IU2VTP_Cardputer_DMR_Terminal_v1.0.3_Cardputer.bin.sha256             --repo "${{ github.repository }}"             --clobber
