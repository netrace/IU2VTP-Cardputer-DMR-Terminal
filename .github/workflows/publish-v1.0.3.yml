name: Publish v1.0.3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.0.3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag v1.0.3
        env:
          TARGET_SHA: bafdd979557d87992552b48f5574b7682fb634b6
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "refs/tags/v1.0.3" >/dev/null 2>&1; then
            echo "Tag v1.0.3 already exists."
          else
            git tag -a v1.0.3 "$TARGET_SHA" -m "IU2VTP Cardputer DMR Terminal v1.0.3"
            git push origin v1.0.3
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > /tmp/release-notes.md <<'EOF'
          First public GitHub baseline of **IU2VTP Cardputer DMR Terminal**.

          ### Highlights

          - Strict receive-only DMR-over-IP operation
          - M5Stack Cardputer / StampS3 target
          - Open DMR Terminal Protocol / Rewind support
          - BrandMeister, HamThings and custom DMR profiles
          - Single-profile operation
          - Favorite talkgroups and direct TG entry
          - Persistent actual RX talkgroup across reboots
          - On-device Wi-Fi setup
          - Shared navigation framework and UI chrome
          - en-US interface
          - Live DMR metadata and RadioID lookup
          - Known-good classic mbelib AMBE+2 decode path
          - MIT License

          ### RX-only boundary

          This project intentionally implements no PTT, microphone capture,
          AMBE encoding, DMR voice transmission, TX voice headers, or TX voice
          terminators. Outbound traffic is limited to the ODTP control plane
          required for authentication, keepalive, subscription, and cancellation.

          See the repository README and AGENTS.md for build instructions and
          architectural constraints.
          EOF

          if gh release view v1.0.3 >/dev/null 2>&1; then
            echo "Release v1.0.3 already exists."
          else
            gh release create v1.0.3               --repo "${{ github.repository }}"               --title "IU2VTP Cardputer DMR Terminal v1.0.3"               --notes-file /tmp/release-notes.md
          fi
