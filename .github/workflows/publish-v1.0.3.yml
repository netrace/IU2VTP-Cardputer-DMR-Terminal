name: Publish v1.0.3

on:
  push:
    branches:
      - main
    paths:
      - '.release-v1.0.3'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.3 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "bafdd979557d87992552b48f5574b7682fb634b6" \
            --title "IU2VTP Cardputer DMR Terminal v1.0.3" \
            --notes "First public baseline of IU2VTP Cardputer DMR Terminal.

### Highlights
- Strictly receive-only DMR-over-IP terminal for M5Stack Cardputer / StampS3
- Open DMR Terminal Protocol / Rewind support
- BrandMeister, HamThings and custom DMR profiles
- On-device Wi-Fi configuration
- Favorite and direct talkgroup selection
- Persistent current RX talkgroup
- Centralized UI navigation framework
- en-US interface
- Live caller metadata and RadioID lookup
- Known-good classic mbelib AMBE+2 receive audio path
- MIT License

### Safety boundary
This project intentionally contains no DMR voice/audio transmit path, PTT, microphone capture or AMBE encoder."

      - name: Remove one-shot release helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .release-v1.0.3
          rm -f .github/workflows/publish-v1.0.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-shot v1.0.3 release helper"
          git push
