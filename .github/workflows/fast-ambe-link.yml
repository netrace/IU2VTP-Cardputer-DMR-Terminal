name: Fast AMBE Rust link test

on:
  push:
    branches:
      - main
      - feature/ptt-tx
    paths:
      - "scripts/link_tx_ambe_rust.py"
      - ".github/workflows/fast-ambe-link.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Download previously validated ESP32-S3 AMBE staticlib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rustlib
          gh run download 35909155980 \
            --repo "${{ github.repository }}" \
            --name ambe-rust-esp32s3 \
            --dir rustlib
          ls -lh rustlib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Link Cardputer firmware with Rust AMBE
        env:
          IU2VTP_AMBE_RUST_LIB: ${{ github.workspace }}/rustlib/libiu2vtp_blip25_ffi.a
        run: pio run -e m5stack-stamps3
