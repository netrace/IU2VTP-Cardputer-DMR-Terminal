name: Assemble v1.0.3 source

on:
  push:
    branches:
      - main
    paths:
      - '.upload_b64/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          cat .upload_b64/part* | base64 -d | gzip -d > src/main.cpp

          expected_size=92217
          actual_size="$(wc -c < src/main.cpp | tr -d ' ')"
          test "$actual_size" = "$expected_size"

          expected_sha="8f7851d9af7ffdc3e6ed1786f8ebb2f54e8c44e1dd2d91606fb92c347d67fd1e"
          actual_sha="$(sha256sum src/main.cpp | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"

          rm -rf .upload_parts .upload_b64
          rm -f .github/workflows/assemble-source.yml

      - name: Commit exact v1.0.3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add exact v1.0.3 firmware source"
          git push
