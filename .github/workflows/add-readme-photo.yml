name: Add README photo

on:
  push:
    branches: [main]
    paths:
      - ".tmp-image/chunk08.b64"
      - ".github/workflows/add-readme-photo.yml"

permissions:
  contents: write

jobs:
  add-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble EXIF-free image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat .tmp-image/chunk*.b64 | base64 -d > docs/cardputer-dmr-terminal.jpg
          test "$(stat -c%s docs/cardputer-dmr-terminal.jpg)" -eq 47775

      - name: Update README
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(); marker="docs/cardputer-dmr-terminal.jpg"; needle="A compact **DMR-over-IP RX/TX terminal** for the **M5Stack Cardputer / StampS3**.\n"; block="\n<p align=\"center\">\n  <img src=\"docs/cardputer-dmr-terminal.jpg\" alt=\"IU2VTP Cardputer DMR Terminal running on M5Stack Cardputer\" width=\"800\">\n</p>\n"; (needle in s) or (_ for _ in ()).throw(SystemExit("README insertion point not found")); p.write_text(s if marker in s else s.replace(needle, needle+block, 1))'

      - name: Commit photo and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .tmp-image
          rm -f .github/workflows/add-readme-photo.yml
          git add -A
          git commit -m "Add Cardputer DMR Terminal photo to README"
          git push
