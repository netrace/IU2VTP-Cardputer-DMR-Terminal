name: Apply PTT alpha2 microphone capture

on:
  push:
    branches:
      - feature/ptt-tx
    paths:
      - ".github/workflows/apply-ptt-alpha2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ptt-tx
          fetch-depth: 0

      - name: Apply alpha2 microphone patch
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/main.cpp")
          s = p.read_text()

          def once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f"Missing patch anchor: {old[:120]!r}")
              s = s.replace(old, new, 1)

          once('APP_VERSION = "1.1.0-alpha1";',
               'APP_VERSION = "1.1.0-alpha2";')
          once('APP_TITLE = "IU2VTP Cardputer DMR Terminal v1.1.0-alpha1";',
               'APP_TITLE = "IU2VTP Cardputer DMR Terminal v1.1.0-alpha2";')
          s = s.replace("IU2VTP Cardputer DMR Terminal v1.1.0-alpha1",
                        "IU2VTP Cardputer DMR Terminal v1.1.0-alpha2")

          once("""enum class TxState {
              IDLE,
              PTT_HELD_TEST
          };

          TxState txState = TxState::IDLE;
          unsigned long txStateStartedMs = 0;
          bool pttWasDown = false;

          static bool txTestActive()
          {
              return txState == TxState::PTT_HELD_TEST;
          }
          """,
          """enum class TxState {
              IDLE,
              PTT_HELD_CAPTURE
          };

          TxState txState = TxState::IDLE;
          unsigned long txStateStartedMs = 0;
          bool pttWasDown = false;

          static constexpr uint32_t TX_MIC_RATE = 16000;
          static constexpr size_t TX_MIC_SAMPLES_16K = 320; // 20 ms
          static constexpr size_t TX_PCM_SAMPLES_8K = 160;  // 20 ms

          struct TxPcmFrame {
              int16_t pcm[TX_PCM_SAMPLES_8K];
          };

          static int16_t txMicBuffers[2][TX_MIC_SAMPLES_16K];
          static QueueHandle_t txPcmQueue = nullptr;
          static volatile uint32_t txMicFramesCaptured = 0;
          static volatile uint32_t txPcmFramesQueued = 0;
          static volatile uint32_t txPcmFramesConsumed = 0;
          static volatile uint32_t txPcmQueueDrops = 0;
          static volatile uint32_t txMicRecordFailures = 0;
          static volatile uint32_t txMicPeak = 0;

          static bool txCaptureActive()
          {
              return txState == TxState::PTT_HELD_CAPTURE;
          }
          """)

          s = s.replace("txTestActive()", "txCaptureActive()")
          s = s.replace('"PTT TEST"', '"PTT MIC"')
          s = s.replace('"PTT HELD - TX DISABLED"', '"PTT MIC - TX DISABLED"')
          s = s.replace('"Experimental PTT state only"', '"Mic capture 16k -> PCM 8k"')
          s = s.replace('"PTT TEST %lus  TG %lu"', '"PTT MIC %lus  TG %lu"')

          once("""            line2 = "Held ";
            line2 += String(txSec);
            line2 += "s - no voice sent";""",
               """            line2 = "Mic ";
            line2 += String(txMicPeak);
            line2 += " pk  q:";
            line2 += String(txPcmQueue ? uxQueueMessagesWaiting(txPcmQueue) : 0);
            line2 += " d:";
            line2 += String(txPcmQueueDrops);""")

          old_helpers = r'''static bool pttKeyDown()
          {
              return M5Cardputer.Keyboard.isKeyPressed('p') ||
                     M5Cardputer.Keyboard.isKeyPressed('P');
          }

          static void beginPttTest()
          {
              if (txState != TxState::IDLE) return;

              if (uiMode != UiMode::MAIN || !dmrSessionReady()) {
                  setUiNotice("PTT unavailable: DMR not ready");
                  Serial.println("[PTT] ignored: DMR session not ready");
                  return;
              }

              txState = TxState::PTT_HELD_TEST;
              txStateStartedMs = millis();
              rxUiDirty = true;
              lastUiDraw = 0;
              Serial.printf("[PTT] TEST START TG %lu (voice TX disabled)\n",
                            (unsigned long)activeTG);
          }

          static void endPttTest()
          {
              if (txState == TxState::IDLE) return;

              unsigned long elapsed = millis() - txStateStartedMs;
              txState = TxState::IDLE;
              txStateStartedMs = 0;
              rxUiDirty = true;
              lastUiDraw = 0;
              Serial.printf("[PTT] TEST END after %lu ms (no voice transmitted)\n",
                            elapsed);
          }

          static void handlePttState()
          {
              const bool down = (uiMode == UiMode::MAIN) && pttKeyDown();

              if (down && !pttWasDown)
                  beginPttTest();
              else if (!down && pttWasDown)
                  endPttTest();

              pttWasDown = down;
          }

          '''

          new_helpers = r'''static bool pttKeyDown()
          {
              return M5Cardputer.Keyboard.isKeyPressed('p') ||
                     M5Cardputer.Keyboard.isKeyPressed('P');
          }

          static void txMicBufferReleased(void*, void* data, size_t length)
          {
              if (!txCaptureActive() || !data || length != TX_MIC_SAMPLES_16K)
                  return;

              const int16_t* src = static_cast<const int16_t*>(data);
              TxPcmFrame frame;
              uint32_t peak = 0;

              for (size_t i = 0; i < TX_PCM_SAMPLES_8K; ++i) {
                  // Simple 2:1 low-pass/downsample: average adjacent 16 kHz samples.
                  int32_t mixed = (int32_t)src[i * 2] + (int32_t)src[i * 2 + 1];
                  int16_t v = (int16_t)(mixed / 2);
                  frame.pcm[i] = v;

                  uint32_t a = (v < 0) ? (uint32_t)(-v) : (uint32_t)v;
                  if (a > peak) peak = a;
              }

              txMicPeak = peak;
              ++txMicFramesCaptured;

              if (txPcmQueue) {
                  if (xQueueSend(txPcmQueue, &frame, 0) == pdTRUE)
                      ++txPcmFramesQueued;
                  else
                      ++txPcmQueueDrops;
              }

              // Requeue the just-released input buffer at the current 16 kHz rate.
              if (txCaptureActive() &&
                  !M5Cardputer.Mic.record(static_cast<int16_t*>(data),
                                         TX_MIC_SAMPLES_16K)) {
                  ++txMicRecordFailures;
              }
          }

          static bool startTxMicCapture()
          {
              if (!txPcmQueue) {
                  txPcmQueue = xQueueCreate(12, sizeof(TxPcmFrame));
                  if (!txPcmQueue) {
                      Serial.println("[PTT/MIC] PCM queue allocation failed");
                      return false;
                  }
              }

              xQueueReset(txPcmQueue);
              txMicFramesCaptured = 0;
              txPcmFramesQueued = 0;
              txPcmFramesConsumed = 0;
              txPcmQueueDrops = 0;
              txMicRecordFailures = 0;
              txMicPeak = 0;

              // Cardputer speaker and microphone share the audio peripheral.
              M5Cardputer.Speaker.stop();
              M5Cardputer.Speaker.end();

              M5Cardputer.Mic.setBufferReleaseCallback(nullptr, txMicBufferReleased);
              if (!M5Cardputer.Mic.begin()) {
                  Serial.println("[PTT/MIC] Mic.begin() failed");
                  M5Cardputer.Mic.setBufferReleaseCallback(nullptr, nullptr);
                  M5Cardputer.Speaker.begin();
                  applySpeakerVolume();
                  return false;
              }

              // Prime both recording request slots for continuous capture.
              bool ok0 = M5Cardputer.Mic.record(txMicBuffers[0],
                                               TX_MIC_SAMPLES_16K,
                                               TX_MIC_RATE);
              bool ok1 = M5Cardputer.Mic.record(txMicBuffers[1],
                                               TX_MIC_SAMPLES_16K);

              if (!ok0 || !ok1) {
                  Serial.printf("[PTT/MIC] prime failed: %d %d\n", ok0, ok1);
                  M5Cardputer.Mic.end();
                  M5Cardputer.Mic.setBufferReleaseCallback(nullptr, nullptr);
                  M5Cardputer.Speaker.begin();
                  applySpeakerVolume();
                  return false;
              }

              Serial.println("[PTT/MIC] capture started: 16 kHz mono -> 8 kHz/160");
              return true;
          }

          static void stopTxMicCapture()
          {
              M5Cardputer.Mic.end();
              M5Cardputer.Mic.setBufferReleaseCallback(nullptr, nullptr);

              if (txPcmQueue)
                  xQueueReset(txPcmQueue);

              M5Cardputer.Speaker.begin();
              applySpeakerVolume();

              Serial.printf("[PTT/MIC] stopped frames=%lu queued=%lu consumed=%lu drops=%lu recfail=%lu peak=%lu\n",
                            (unsigned long)txMicFramesCaptured,
                            (unsigned long)txPcmFramesQueued,
                            (unsigned long)txPcmFramesConsumed,
                            (unsigned long)txPcmQueueDrops,
                            (unsigned long)txMicRecordFailures,
                            (unsigned long)txMicPeak);
          }

          static void processTxPcmDebug()
          {
              if (!txCaptureActive() || !txPcmQueue) return;

              TxPcmFrame frame;
              while (xQueueReceive(txPcmQueue, &frame, 0) == pdTRUE) {
                  // Alpha2 terminates here. This 160-sample / 8 kHz frame is the
                  // future input to the AMBE encoder. Nothing is transmitted.
                  ++txPcmFramesConsumed;
              }
          }

          static void beginPttTest()
          {
              if (txState != TxState::IDLE) return;

              if (uiMode != UiMode::MAIN || !dmrSessionReady()) {
                  setUiNotice("PTT unavailable: DMR not ready");
                  Serial.println("[PTT] ignored: DMR session not ready");
                  return;
              }

              txState = TxState::PTT_HELD_CAPTURE;
              txStateStartedMs = millis();

              if (!startTxMicCapture()) {
                  txState = TxState::IDLE;
                  txStateStartedMs = 0;
                  setUiNotice("Microphone start failed");
                  return;
              }

              rxUiDirty = true;
              lastUiDraw = 0;
              Serial.printf("[PTT] MIC START TG %lu (voice TX disabled)\n",
                            (unsigned long)activeTG);
          }

          static void endPttTest()
          {
              if (txState == TxState::IDLE) return;

              unsigned long elapsed = millis() - txStateStartedMs;
              txState = TxState::IDLE;
              txStateStartedMs = 0;

              stopTxMicCapture();

              rxUiDirty = true;
              lastUiDraw = 0;
              Serial.printf("[PTT] MIC END after %lu ms (no voice transmitted)\n",
                            elapsed);
          }

          static void handlePttState()
          {
              const bool down = (uiMode == UiMode::MAIN) && pttKeyDown();

              if (down && !pttWasDown)
                  beginPttTest();
              else if (!down && pttWasDown)
                  endPttTest();

              pttWasDown = down;
          }

          '''

          once(old_helpers, new_helpers)

          once("""    handleKeyboard();
              if (uiMode == UiMode::MAIN) {
                  drawUi();
              }
          """,
          """    handleKeyboard();
              processTxPcmDebug();
              if (uiMode == UiMode::MAIN) {
                  drawUi();
              }
          """)

          p.write_text(s)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build alpha2
        run: pio run -e m5stack-stamps3

      - name: Commit alpha2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          git commit -m "Add PTT alpha2 microphone PCM capture"
          git fetch origin feature/ptt-tx
          git rebase origin/feature/ptt-tx
          git push origin HEAD:feature/ptt-tx
