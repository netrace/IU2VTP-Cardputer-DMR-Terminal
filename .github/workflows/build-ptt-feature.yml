name: Build PTT feature branch

on:
  push:
    branches:
      - feature/ptt-tx
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "scripts/**"
      - "platformio.ini"
      - "tools/ambe_ref/**"
      - "tools/dmr_mapping_test.cpp"
      - "tools/rewind_tx_test.cpp"
      - "codec/blip25_ffi/**"
      - ".github/workflows/build-ptt-feature.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build Cardputer safe backend
        run: pio run -e m5stack-stamps3

      - name: DMR AMBE mapping host test
        run: |
          g++ -std=c++17 -Iinclude \
            tools/dmr_mapping_test.cpp src/dmr_ambe_mapping.cpp \
            -o /tmp/dmr_mapping_test
          /tmp/dmr_mapping_test

      - name: Rewind TX framing host test
        run: |
          g++ -std=c++17 -Iinclude \
            tools/rewind_tx_test.cpp src/rewind_tx_protocol.cpp \
            -o /tmp/rewind_tx_test
          /tmp/rewind_tx_test

      - name: AMBE+2 host reference round-trip
        run: cargo run --release --manifest-path tools/ambe_ref/Cargo.toml

      - name: AMBE Rust C-ABI backend tests
        run: cargo test --release --manifest-path codec/blip25_ffi/Cargo.toml

  rust-xtensa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Build AMBE staticlib for ESP32-S3
        run: |
          cargo build -Zbuild-std=std,panic_abort --release \
            --target xtensa-esp32s3-espidf \
            --manifest-path codec/blip25_ffi/Cargo.toml

      - name: Upload ESP32-S3 AMBE staticlib
        uses: actions/upload-artifact@v4
        with:
          name: ambe-rust-esp32s3
          path: codec/blip25_ffi/target/xtensa-esp32s3-espidf/release/libiu2vtp_blip25_ffi.a
          if-no-files-found: error

  firmware-rust-backend:
    needs: rust-xtensa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AMBE Rust staticlib
        uses: actions/download-artifact@v4
        with:
          name: ambe-rust-esp32s3
          path: rustlib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build Cardputer with Rust AMBE backend
        env:
          IU2VTP_AMBE_RUST_LIB: ${{ github.workspace }}/rustlib/libiu2vtp_blip25_ffi.a
        run: pio run -e m5stack-stamps3

      - name: Prepare alpha6 firmware asset
        run: |
          cp .pio/build/m5stack-stamps3/firmware.bin              IU2VTP_Cardputer_DMR_Terminal_v1.1.0-alpha6_PTT.bin
          sha256sum IU2VTP_Cardputer_DMR_Terminal_v1.1.0-alpha6_PTT.bin             > IU2VTP_Cardputer_DMR_Terminal_v1.1.0-alpha6_PTT.bin.sha256

      - name: Upload experimental firmware
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-alpha6-group-private-ptt
          path: |
            IU2VTP_Cardputer_DMR_Terminal_v1.1.0-alpha6_PTT.bin
            IU2VTP_Cardputer_DMR_Terminal_v1.1.0-alpha6_PTT.bin.sha256
          if-no-files-found: error
