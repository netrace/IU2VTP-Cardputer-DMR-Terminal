name: Build PTT feature branch

on:
  push:
    branches:
      - feature/ptt-tx
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "scripts/**"
      - "platformio.ini"
      - "tools/ambe_ref/**"
      - ".github/workflows/build-ptt-feature.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build Cardputer
        run: pio run -e m5stack-stamps3

      - name: AMBE+2 host reference round-trip
        run: cargo run --release --manifest-path tools/ambe_ref/Cargo.toml
